name: ansible tests

on: [pull_request]

jobs:
  build:

    # Was ubuntu-18.04: GitHub retired that image, so jobs queued for 24 h and
    # were cancelled without ever starting.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # ubuntu-latest's system Python is externally managed (PEP 668), so a bare
    # `pip install` there is refused. Use a setup-python interpreter instead.
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    # `ansible` (the full package, as apt installed it before) rather than
    # ansible-core, so the collections the playbooks use are present.
    - name: install dependencies
      run: pip install ansible ansible-lint yamllint

    # Both lint steps are advisory, as they always were: the playbooks date
    # from 2020 and fail current ansible-lint by a wide margin.
    - name: yamllint test
      continue-on-error: true
      run: |
        yamllint -d relaxed .

    - name: ansible-lint test
      continue-on-error: true
      run: |
        ansible-lint --version
        rc=0
        ansible-lint -c web/vars/testing/.ansible-lint web/main.yml || rc=$?
        ansible-lint -c web/vars/testing/.ansible-lint local/main.yml || rc=$?
        exit "$rc"
